# TEMPORARY: read-only check of how a new reading thread would be imported. Deleted after use.
name: Diag thread
on:
  push:
    branches: [claude/reads-microblog-jekyll-vuocqj]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Look
        working-directory: scripts
        run: |
          python - <<'PY'
          import re, discover_books as d, import_bluesky as imp
          from datetime import datetime, timezone
          h = "booksbyspec.bsky.social"
          feed = imp.xrpc("app.bsky.feed.getAuthorFeed", actor=h, filter="posts_no_replies", limit=10)
          print("== Recent top-level posts (first line) ==")
          for it in feed.get("feed", []):
              r = it["post"]["record"]
              line = (r.get("text") or "").strip().splitlines()[0] if r.get("text") else ""
              print(r.get("createdAt"), "repost" if it.get("reason") else "", "| opener match:", bool(d.OPENER_RE.match(line)), "|", line[:100])
          print("== Dry-run discovery ==")
          print(d.discover(d.REPO, h, dry_run=True))
          for title, author, post in d.recent_openers(h, datetime.now(timezone.utc)):
              print(f"== Thread: {title} / {author} ==")
              t = imp.xrpc("app.bsky.feed.getPostThread", uri=post["uri"], depth=1000)
              out = []
              def walk(n):
                  p = n.get("post") or {}
                  if p.get("author", {}).get("handle") == h:
                      out.append(p)
                      for c in n.get("replies") or []:
                          walk(c)
              walk(t["thread"])
              for p in sorted(out, key=lambda p: p["record"]["createdAt"]):
                  txt = p["record"].get("text", "")
                  print(p["record"]["createdAt"], "| chapter:", imp.find_chapter(txt), "|", txt.replace("\n", " / ")[:90])
          PY
