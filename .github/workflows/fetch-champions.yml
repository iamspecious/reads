# fetch-champions.yml — downloads portraits of the mains listed in your
# logs (see scripts/fetch_champions.py for how and why).
#
# Runs by itself whenever a log file changes on main (so adding a new main
# gets its portrait within a minute or two), or with the Run workflow button.
# Portraits already in the repo are never downloaded again.

name: Fetch champion portraits

on:
  push:
    branches: [main]
    paths: ["_logs/**"]
  workflow_dispatch:

# Write access to commit the portraits, and pages: write to ask for a rebuild.
permissions:
  contents: write
  pages: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download missing portraits
        run: python scripts/fetch_champions.py
      - name: Commit them
        id: commit
        run: |
          git add assets/images/champions
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add champion portraits"
          for attempt in 1 2 3; do
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}" && git push && echo "pushed=true" >> "$GITHUB_OUTPUT" && exit 0
            sleep $((attempt * 5))
          done
          exit 1
      # Commits made by a workflow don't always start a Pages rebuild, so ask for one.
      - name: Rebuild the site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent || echo "Couldn't request a rebuild; the next push will rebuild the site."
