# fetch-champions.yml — downloads two kinds of portraits:
#  - champions: the mains listed in your logs (scripts/fetch_champions.py)
#  - characters: a game's character card picture (scripts/fetch_portraits.py)
# Each script explains how and why. The file keeps its old name so its run
# history stays in one place; only the name shown on GitHub changed.
#
# Runs by itself whenever a log or entry changes on main (so a new main, or
# a champion first played in a logged session, gets its portrait within a
# minute or two), or with the Run workflow button.
# Portraits already in the repo are never downloaded again.

name: Fetch portraits

on:
  push:
    branches: [main]
    paths: ["_logs/**", "_entries/**"]
  workflow_dispatch:

# Write access to commit the portraits, and pages: write to ask for a rebuild.
permissions:
  contents: write
  pages: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download missing champion portraits
        run: python scripts/fetch_champions.py
      - name: Download missing character portraits
        run: python scripts/fetch_portraits.py
      - name: Commit them
        id: commit
        run: |
          git add assets/images/champions assets/images/characters
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add portraits"
          for attempt in 1 2 3; do
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}" && git push && echo "pushed=true" >> "$GITHUB_OUTPUT" && exit 0
            sleep $((attempt * 5))
          done
          exit 1
      # Commits made by a workflow don't always start a Pages rebuild, so ask for one.
      - name: Rebuild the site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent || echo "Couldn't request a rebuild; the next push will rebuild the site."
